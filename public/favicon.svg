<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Shield/Rounded Square -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Soccer Ball Shield Core -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Ball circle -->
    <circle r="130" fill="#f8fafc" stroke="#0f172a" stroke-width="8"/>
    <!-- Central pentagon -->
    <polygon points="0,-48 46,-15 28,40 -28,40 -46,-15" fill="#0f172a"/>
    <!-- Seams and adjacent patches -->
    <line x1="0" y1="-48" x2="0" y2="-90" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
    <polygon points="0,-90 42,-120 78,-100 46,-15" fill="none" stroke="#0f172a" stroke-width="8" stroke-linejoin="round"/>
    
    <line x1="46" y1="-15" x2="88" y2="-5" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
    <polygon points="88,-5 125,25 110,65 28,40" fill="none" stroke="#0f172a" stroke-width="8" stroke-linejoin="round"/>
    
    <line x1="28" y1="40" x2="45" y2="85" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
    <polygon points="45,85 0,122 -45,85 -28,40" fill="#0f172a"/>
    
    <line x1="-28" y1="40" x2="-45" y2="85" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
    
    <line x1="-46" y1="-15" x2="-88" y2="-5" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
    <polygon points="-88,-5 -125,25 -110,65 -28,40" fill="none" stroke="#0f172a" stroke-width="8" stroke-linejoin="round"/>
    
    <polygon points="0,-90 -42,-120 -78,-100 -46,-15" fill="none" stroke="#0f172a" stroke-width="8" stroke-linejoin="round"/>
    <polygon points="-42,-120 0,-128 42,-120" fill="#0f172a"/>
    <polygon points="120,-30 128,10 88,-5" fill="#0f172a"/>
    <polygon points="-120,-30 -128,10 -88,-5" fill="#0f172a"/>
  </g>

  <!-- Stars at top -->
  <g fill="url(#gold-grad)">
    <polygon points="256,60 263,76 280,78 268,90 271,107 256,98 241,107 244,90 232,78 249,76" />
    <polygon points="210,75 215,88 229,89 219,99 222,113 210,105 198,113 200,99 191,89 204,88" transform="scale(0.8) translate(50, 20)"/>
    <polygon points="302,75 307,88 321,89 311,99 314,113 302,105 290,113 292,99 283,89 296,88" transform="scale(0.8) translate(80, 20)"/>
  </g>

  <!-- Laurel / Ribbon accent text arc or badge -->
  <rect x="116" y="415" width="280" height="42" rx="21" fill="#10b981" />
  <text x="256" y="443" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">SANTA ROSA</text>
</svg>
